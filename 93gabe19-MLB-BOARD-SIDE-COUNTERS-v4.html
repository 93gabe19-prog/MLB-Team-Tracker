<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>93GABE19 MLB Team Board - New Banner</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#080c12;font-family:Arial,Helvetica,sans-serif;
}
.board{
  width:100vw;height:100vh;padding:0 18px 18px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:220px repeat(8,1fr);
  gap:7px;
}
.header{
  grid-column:1 / -1;
  position:relative;overflow:hidden;
  border-bottom:2px solid #344354;
  background:#080c12;
}
.header img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  transform:translateY(7px);
}
.team{
  position:relative;min-width:0;min-height:0;
  border:1px solid #303a47;border-radius:7px;
  background:linear-gradient(145deg,#202a36,#151d27);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;overflow:hidden;
  padding:0;
}
.team img{
  width:50%;height:92%;object-fit:contain;flex:0 0 50%;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55))
         drop-shadow(0 0 11px rgba(255,255,255,.18));
  transform:scale(1.24);
  transition:transform .15s ease,opacity .15s ease,filter .15s ease;
}
.teamName{
  flex:1;min-width:0;
  display:flex;align-items:center;justify-content:flex-start;
  padding:0 7px 0 3px;
  text-align:left;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(10px,1.02vw,18px);
  line-height:1.02;
  font-weight:900;
  letter-spacing:.25px;
  text-transform:uppercase;
  -webkit-text-stroke:.45px rgba(0,0,0,.9);
  text-shadow:
    0 2px 0 #111,
    0 3px 0 #050505,
    1px 4px 3px rgba(0,0,0,.9),
    0 0 5px rgba(255,255,255,.18);
}
.team:hover img{
  transform:scale(1.24);
  filter:drop-shadow(0 0 7px rgba(255,255,255,.7))
         drop-shadow(0 0 15px rgba(255,255,255,.22));
}
.team.taken::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(45deg,transparent 47%,#e21b2d 48%,#e21b2d 52%,transparent 53%),
    linear-gradient(-45deg,transparent 47%,#e21b2d 48%,#e21b2d 52%,transparent 53%);
  pointer-events:none;z-index:2;
}
.team.taken::before{
  content:attr(data-name);
  position:absolute;z-index:3;
  left:5%;right:5%;top:50%;
  transform:translateY(-50%);
  text-align:center;color:#fff;
  font-size:clamp(10px,1.15vw,20px);
  line-height:1.05;font-weight:900;
  text-shadow:0 2px 4px rgba(0,0,0,.95),0 0 7px rgba(0,0,0,.95);
  pointer-events:none;
}
.team.taken img{opacity:.22;filter:grayscale(1) brightness(.65)}
.team.taken .teamName{opacity:0;}
.cutout{
  background:#080c12;
  border:1px solid #080c12;
  border-radius:7px;
  cursor:default;
}

 .side-counter{
  position:absolute;z-index:20;
  top:270px;
  width:140px;height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;
  padding:12px 8px;
  color:#fff;
  background:linear-gradient(145deg,rgba(25,35,48,.98),rgba(9,14,21,.98));
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  box-shadow:0 5px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  pointer-events:none;
  text-align:center;
}
.available-counter{left:100px;}
.taken-counter{right:100px;}
.counter-title{
  font-size:16px;line-height:1;letter-spacing:1.2px;
  text-transform:uppercase;font-weight:900;white-space:nowrap;
  text-shadow:0 2px 4px rgba(0,0,0,.85);
}
.counter-number{
  font-size:54px;line-height:.9;font-weight:1000;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px currentColor,0 3px 5px rgba(0,0,0,.8);
}
.available-counter .counter-number{color:#39ff14;}
.taken-counter .counter-number{color:#ff1744;}
.counter-rule{
  width:74%;height:1px;background:rgba(255,255,255,.16);
}
@media(max-width:1100px){
  .side-counter{top:300px;width:120px;height:135px;}
  .available-counter{left:70px;}
  .taken-counter{right:70px;}
  .counter-title{font-size:13px;letter-spacing:.9px;}
  .counter-number{font-size:46px;}
}
@media(max-width:700px){
  .side-counter{
    top:190px;width:88px;height:105px;padding:8px 4px;gap:6px;border-radius:7px;
  }
  .available-counter{left:10px;}
  .taken-counter{right:10px;}
  .counter-title{font-size:8px;letter-spacing:.55px;}
  .counter-number{font-size:34px;}
  .counter-rule{width:72%;}
}

.teamName{
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.65));
}
</style>
</head>

<script>
const teams = [...document.querySelectorAll('.team')];
const availableCount = document.getElementById('availableCount');
const takenCount = document.getElementById('takenCount');

function refreshCounters(){
  const taken = teams.filter(team => team.classList.contains('taken')).length;
  const available = teams.length - taken;
  availableCount.textContent = available;
  takenCount.textContent = taken;
}

teams.forEach(team => {
  team.addEventListener('click', () => {
    team.classList.toggle('taken');
    refreshCounters();
  });
});

refreshCounters();
</script>
